name: Gothic Tales – Prüfen, bauen und veröffentlichen

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gothic-tales-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: System prüfen und Paket bauen
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Versionsnummern prüfen
        id: version
        shell: bash
        run: |
          set -euo pipefail

          system_version="$(node -p "JSON.parse(require('fs').readFileSync('system.json', 'utf8')).version")"
          package_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"

          if [[ -z "$system_version" ]]; then
            echo "system.json enthält keine Versionsnummer." >&2
            exit 1
          fi

          if [[ "$system_version" != "$package_version" ]]; then
            echo "Versionskonflikt: system.json=$system_version, package.json=$package_version" >&2
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            expected_tag="v${system_version}"
            if [[ "${GITHUB_REF_NAME}" != "$expected_tag" ]]; then
              echo "Der Tag ${GITHUB_REF_NAME} passt nicht zur Systemversion ${system_version}. Erwartet: ${expected_tag}" >&2
              exit 1
            fi
          fi

          echo "version=$system_version" >> "$GITHUB_OUTPUT"
          echo "Systemversion: $system_version"

      - name: Öffentliche Fassung auf Drittmaterial prüfen
        shell: bash
        run: |
          set -euo pipefail

          forbidden_maps="$(find assets/maps -maxdepth 1 -type f \
            \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' \
               -o -iname '*.gif' -o -iname '*.avif' -o -iname '*.svg' -o -iname '*.tif' \
               -o -iname '*.tiff' -o -iname '*.bmp' -o -iname '*.pdf' \) -print 2>/dev/null || true)"

          if [[ -n "$forbidden_maps" ]]; then
            echo "Die öffentliche Ausgabe darf keine nicht freigegebenen Karten- oder PDF-Dateien enthalten:" >&2
            echo "$forbidden_maps" >&2
            exit 1
          fi

          if [[ -d "packs/gt-karten" ]]; then
            echo "Das nicht öffentliche Karten-Kompendium packs/gt-karten darf nicht veröffentlicht werden." >&2
            exit 1
          fi

          if grep -q '"gt-karten"' system.json; then
            echo "system.json enthält noch einen Verweis auf das Karten-Kompendium gt-karten." >&2
            exit 1
          fi

      - name: Systemtests ausführen
        run: npm run check

      - name: Foundry-Paket erstellen
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build dist
          mkdir -p build/gothic-tales dist

          runtime_directories=(
            assets
            data
            lang
            macros
            packs
            scripts
            styles
            templates
          )

          runtime_files=(
            system.json
            template.json
            LICENSE.txt
            README.md
            THIRD_PARTY_NOTICES.md
          )

          for directory in "${runtime_directories[@]}"; do
            if [[ -d "$directory" ]]; then
              cp -a "$directory" "build/gothic-tales/"
            fi
          done

          for file in "${runtime_files[@]}"; do
            if [[ -f "$file" ]]; then
              cp -a "$file" "build/gothic-tales/"
            fi
          done

          (
            cd build
            zip -q -r -9 ../dist/gothic-tales.zip gothic-tales
          )

          sha256sum dist/gothic-tales.zip > dist/gothic-tales.zip.sha256

          unzip -tq dist/gothic-tales.zip
          unzip -Z1 dist/gothic-tales.zip | grep -q '^gothic-tales/system.json$'

          if unzip -Z1 dist/gothic-tales.zip | grep -Eiq '^gothic-tales/assets/maps/.*\.(png|jpe?g|webp|gif|avif|svg|tiff?|bmp|pdf)$'; then
            echo "Das Release-Archiv enthält nicht freigegebene Kartendateien." >&2
            exit 1
          fi

          echo "Erstellt: dist/gothic-tales.zip"
          cat dist/gothic-tales.zip.sha256

      - name: Build-Artefakt bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: gothic-tales-${{ steps.version.outputs.version }}
          path: |
            dist/gothic-tales.zip
            dist/gothic-tales.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: GitHub-Release erstellen oder aktualisieren
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          SYSTEM_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              dist/gothic-tales.zip \
              dist/gothic-tales.zip.sha256 \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              dist/gothic-tales.zip \
              dist/gothic-tales.zip.sha256 \
              --verify-tag \
              --title "Gothic Tales ${SYSTEM_VERSION}" \
              --generate-notes
          fi
