name: Gothic Tales – Build und Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gothic-tales-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: System prüfen und ZIP erstellen
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Node.js 24 einrichten
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: ZIP-Werkzeuge sicherstellen
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes zip unzip

      - name: Version prüfen
        id: version
        shell: bash
        run: |
          set -euo pipefail

          system_version="$(node -p "JSON.parse(require('fs').readFileSync('system.json', 'utf8')).version")"
          package_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"

          if [[ -z "$system_version" ]]; then
            echo "::error file=system.json::In system.json fehlt die Versionsnummer."
            exit 1
          fi

          if [[ "$system_version" != "$package_version" ]]; then
            echo "::error::Versionskonflikt: system.json=$system_version, package.json=$package_version"
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            expected_tag="v${system_version}"
            if [[ "${GITHUB_REF_NAME}" != "$expected_tag" ]]; then
              echo "::error::Der Tag ${GITHUB_REF_NAME} passt nicht zu Version ${system_version}. Erwartet: ${expected_tag}"
              exit 1
            fi
          fi

          echo "version=$system_version" >> "$GITHUB_OUTPUT"
          echo "release_tag=v${system_version}" >> "$GITHUB_OUTPUT"

      - name: Benötigte Dateien prüfen
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            system.json
            package.json
            template.json
            scripts/gothic-tales.mjs
            scripts/gothic-tales-version.mjs
            styles/gothic-tales.css
            lang/de.json
            lang/en.json
          )

          missing=0
          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error file=$file::Erforderliche Datei fehlt: $file"
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Öffentliche Fassung prüfen
        shell: bash
        run: |
          set -euo pipefail

          forbidden_maps="$(find assets/maps -maxdepth 1 -type f \
            \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' \
               -o -iname '*.gif' -o -iname '*.avif' -o -iname '*.svg' -o -iname '*.tif' \
               -o -iname '*.tiff' -o -iname '*.bmp' -o -iname '*.pdf' \) \
            -print 2>/dev/null || true)"

          if [[ -n "$forbidden_maps" ]]; then
            echo "::error::Nicht freigegebene Karten- oder PDF-Dateien wurden gefunden:"
            printf '%s\n' "$forbidden_maps"
            exit 1
          fi

          if [[ -d "packs/gt-karten" ]]; then
            echo "::error::packs/gt-karten darf nicht Teil der öffentlichen Ausgabe sein."
            exit 1
          fi

          if grep -q '"gt-karten"' system.json; then
            echo "::error file=system.json::system.json enthält noch gt-karten."
            exit 1
          fi

      - name: Systemtests ausführen
        run: npm run check

      - name: Foundry-System als ZIP bauen
        id: package
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build dist
          mkdir -p build/gothic-tales dist

          runtime_directories=(
            assets
            data
            lang
            macros
            packs
            scripts
            styles
            templates
          )

          runtime_files=(
            system.json
            template.json
            LICENSE.txt
            README.md
            THIRD_PARTY_NOTICES.md
          )

          for directory in "${runtime_directories[@]}"; do
            if [[ -d "$directory" ]]; then
              cp -a "$directory" build/gothic-tales/
            fi
          done

          for file in "${runtime_files[@]}"; do
            if [[ -f "$file" ]]; then
              cp -a "$file" build/gothic-tales/
            fi
          done

          (
            cd build
            zip -r -9 ../dist/gothic-tales.zip gothic-tales
          )

          sha256sum dist/gothic-tales.zip > dist/gothic-tales.zip.sha256

          test -s dist/gothic-tales.zip
          unzip -t dist/gothic-tales.zip
          unzip -Z1 dist/gothic-tales.zip | grep -Fxq 'gothic-tales/system.json'

          zip_size="$(du -h dist/gothic-tales.zip | cut -f1)"
          echo "zip_size=$zip_size" >> "$GITHUB_OUTPUT"
          echo "ZIP erstellt: dist/gothic-tales.zip ($zip_size)"
          ls -lah dist/

      - name: ZIP als Actions-Artefakt hochladen
        uses: actions/upload-artifact@v7
        with:
          name: gothic-tales-${{ steps.version.outputs.version }}
          path: |
            dist/gothic-tales.zip
            dist/gothic-tales.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: GitHub-Release erstellen oder aktualisieren
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          SYSTEM_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              dist/gothic-tales.zip \
              dist/gothic-tales.zip.sha256 \
              --clobber

            gh release edit "$RELEASE_TAG" \
              --title "Gothic Tales ${SYSTEM_VERSION}" \
              --latest
          else
            release_args=(
              "$RELEASE_TAG"
              dist/gothic-tales.zip
              dist/gothic-tales.zip.sha256
              --target "$GITHUB_SHA"
              --title "Gothic Tales ${SYSTEM_VERSION}"
              --latest
            )

            if [[ -f "RELEASE-${SYSTEM_VERSION}.md" ]]; then
              release_args+=(--notes-file "RELEASE-${SYSTEM_VERSION}.md")
            else
              release_args+=(--generate-notes)
            fi

            gh release create "${release_args[@]}"
          fi

          gh release view "$RELEASE_TAG" --json url,tagName,name

      - name: Build-Zusammenfassung
        if: always()
        shell: bash
        run: |
          {
            echo "## Gothic Tales Build"
            echo
            echo "- Version: \`${{ steps.version.outputs.version }}\`"
            echo "- Datei: \`gothic-tales.zip\`"
            echo "- Größe: \`${{ steps.package.outputs.zip_size }}\`"
            if [[ "${{ github.event_name }}" != "pull_request" ]]; then
              echo "- Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${{ steps.version.outputs.release_tag }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
